name: SA PSD tool runner

on:
  workflow_call:

permissions:
  contents: read

jobs:
  psd-spine-validation:
    name: Native PSD and Spine 4.3 validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Report assigned runner
        shell: bash
        run: |
          echo "runner_name=${RUNNER_NAME:-unknown}"
          echo "runner_os=${RUNNER_OS:-unknown}"
          echo "runner_arch=${RUNNER_ARCH:-unknown}"
          echo "image_os=${ImageOS:-unknown}"
          echo "image_version=${ImageVersion:-unknown}"
          uname -a
          df -h .
          python3 --version || true
          node --version || true

      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate v7.54 semantic exporter
        run: node --test tests/v754-exporter.test.mjs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PSD processing dependencies
        run: python -m pip install --disable-pip-version-check 'Pillow>=10,<14' 'psd-tools>=1.27,<2'

      - name: Verify native PSD/PSB hierarchy extraction
        run: python -m unittest discover -s tests -p test_psd_v754_tree.py -v

      - name: Verify native PSD-to-Spine raster and ZIP packaging
        run: python -m unittest discover -s tests -p test_psd_spine_*.py -v

      - name: Verify native PSD composite and fail-closed guards
        run: python -m unittest discover -s tests -p test_native_psd_composite.py -v

      - name: Assert no generated animation is implied
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('tools/native_psd_composite.py').read_text()
          assert 'native_editor_frame_zero_approved' in s
          assert 'independent_layer_recomposition_approved' in s
          print('PASS: source pixel fidelity only; artistic acceptance remains false')
          PY
