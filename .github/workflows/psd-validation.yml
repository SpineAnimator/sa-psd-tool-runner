name: SA PSD tool runner

on:
  workflow_call:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-smoke:
    if: github.repository == 'SpineAnimator/sa-psd-tool-runner'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prove GitHub-hosted runner allocation and toolchain
        shell: bash
        run: |
          echo "RUNNER_NAME=$RUNNER_NAME"
          echo "RUNNER_OS=$RUNNER_OS"
          echo "RUNNER_ARCH=$RUNNER_ARCH"
          uname -a
          python3 --version
          node --version
      - name: Checkout runner image sources
        uses: actions/checkout@v4
      - name: Validate runner bootstrap script
        run: bash -n entrypoint.sh
      - name: Build optional self-hosted runner image
        run: docker build --pull -t sa-psd-tool-runner:ci .
      - name: Inspect runner image
        run: docker image inspect sa-psd-tool-runner:ci --format '{{.Os}}/{{.Architecture}}'
      - name: Validate Compose deployment configuration
        run: docker compose config --quiet

  psd-spine-validation:
    if: github.repository != 'SpineAnimator/sa-psd-tool-runner'
    name: Native PSD and Spine 4.3 validation
    # The caller opts into the user's explicitly authorized self-hosted macOS runner.
    # This is macOS, not Linux; no Spine Editor GUI validation is performed here.
    runs-on: [self-hosted, macOS, X64, sa-psd-tool-runner]
    timeout-minutes: 25
    steps:
      - name: Report assigned runner
        shell: bash
        run: |
          echo "runner_name=$RUNNER_NAME"
          echo "runner_os=$RUNNER_OS"
          echo "runner_arch=$RUNNER_ARCH"
          uname -a
          df -h .
          python3 --version
          node --version

      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate v7.54 semantic exporter
        run: node --test tests/v754-exporter.test.mjs

      - name: Bootstrap the preinstalled Python 3.11 runtime
        run: |
          python3.11 --version
          python3.11 -m ensurepip --upgrade
          python3.11 -m pip --version

      - name: Install PSD processing dependencies
        run: python3.11 -m pip install --disable-pip-version-check 'Pillow>=10,<14' 'psd-tools>=1.27,<2'

      - name: Verify native PSD/PSB hierarchy extraction
        run: python3.11 -m unittest discover -s tests -p test_psd_v754_tree.py -v

      - name: Verify native PSD-to-Spine raster and ZIP packaging
        run: python -m unittest discover -s tests -p 'test_psd_spine_*.py' -v

      - name: Verify native PSD composite and fail-closed guards
        run: python -m unittest discover -s tests -p test_native_psd_composite.py -v

      - name: Assert no generated animation is implied
        shell: bash
        run: |
          python3.11 - <<'PY'
          from pathlib import Path
          s = Path('tools/native_psd_composite.py').read_text()
          assert 'native_editor_frame_zero_approved' in s
          assert 'independent_layer_recomposition_approved' in s
          print('PASS: source pixel fidelity only; artistic acceptance remains false')
          PY
