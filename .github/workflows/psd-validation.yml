name: SA PSD tool runner

on:
  workflow_call:
    inputs:
      source-repository:
        description: Private or public source repository to validate
        required: false
        type: string
        default: ''
      source-ref:
        description: Exact source branch, tag, or commit to validate
        required: false
        type: string
        default: main
      suite:
        description: Validation suite to execute
        required: false
        type: string
        default: psd
    secrets:
      SOURCE_REPO_TOKEN:
        required: false
      SPINE_LICENSE:
        required: false
      SPINE_LINUX_URL:
        required: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-runner-smoke:
    if: github.repository == 'SpineAnimator/sa-psd-tool-runner'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Prove GitHub-hosted Ubuntu 24.04 allocation and toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = Linux
          grep -q 'Ubuntu 24.04' /etc/os-release
          echo "RUNNER_NAME=$RUNNER_NAME"
          echo "RUNNER_OS=$RUNNER_OS"
          echo "RUNNER_ARCH=$RUNNER_ARCH"
          uname -a
          python3 --version
          node --version
      - name: Checkout public runner contract sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate public-only runner contract
        run: python3 -m unittest discover -s tests -p 'test_public_runner_contract.py' -v
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache: false
      - name: Lint every public PSD runner workflow
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/*.yml

  psd-spine-validation:
    if: github.repository != 'SpineAnimator/sa-psd-tool-runner' && inputs.suite == 'psd'
    name: Native PSD and Spine 4.3 validation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Report assigned runner
        shell: bash
        run: |
          echo "runner_name=$RUNNER_NAME"
          echo "runner_os=$RUNNER_OS"
          echo "runner_arch=$RUNNER_ARCH"
          uname -a
          df -h .
          python3 --version
          node --version
      - name: Require private-source token when a private source is requested
        if: inputs.source-repository != ''
        env:
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
        run: test -n "$SOURCE_REPO_TOKEN" || { echo "::error::SOURCE_REPO_TOKEN is required for private source checkout."; exit 1; }
      - name: Checkout exact source repository and revision
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source-repository || github.repository }}
          ref: ${{ inputs.source-ref || github.sha }}
          token: ${{ secrets.SOURCE_REPO_TOKEN || github.token }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate v7.54 semantic exporter
        run: node --test tests/v754-exporter.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PSD processing dependencies
        run: python3.11 -m pip install --disable-pip-version-check 'Pillow>=10,<14' 'psd-tools>=1.27,<2'
      - name: Verify native PSD/PSB hierarchy extraction
        run: python3.11 -m unittest discover -s tests -p test_psd_v754_tree.py -v
      - name: Verify native PSD-to-Spine raster and ZIP packaging
        run: python3.11 -m unittest discover -s tests -p 'test_psd_spine_*.py' -v
      - name: Verify native PSD composite and fail-closed guards
        run: python3.11 -m unittest discover -s tests -p test_native_psd_composite.py -v
      - name: Assert no generated animation is implied
        shell: bash
        run: |
          python3.11 - <<'PY'
          from pathlib import Path
          s = Path('tools/native_psd_composite.py').read_text()
          assert 'native_editor_frame_zero_approved' in s
          assert 'independent_layer_recomposition_approved' in s
          print('PASS: source pixel fidelity only; artistic acceptance remains false')
          PY

  public-site-browser-e2e:
    if: github.repository != 'SpineAnimator/sa-psd-tool-runner' && inputs.suite == 'public-site-e2e'
    name: Public website layered PSD to ZIP browser E2E • public Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source-repository || 'vladleopold/3Spine-core' }}
          ref: ${{ inputs.source-ref || 'main' }}
          token: ${{ secrets.SOURCE_REPO_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked browser and PSD dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false ag-psd@14.5.2
          npx playwright install --with-deps chromium
      - name: Run public website layered PSD import, live cloud plan and ZIP E2E
        run: node scripts/verify_public_site_e2e.mjs
      - name: Retain nonsensitive browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-site-psd-e2e-evidence
          path: ${{ runner.temp }}/public-spine-e2e/
          if-no-files-found: ignore
          retention-days: 7

  native-user-spine-project:
    if: inputs.suite == 'user-spine-project'
    name: Licensed Spine Editor 4.3.26 validation • public Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SPINE_LICENSE: ${{ secrets.SPINE_LICENSE }}
      SPINE_LINUX_URL: ${{ secrets.SPINE_LINUX_URL }}
    steps:
      - name: Check licensed Editor and private source configuration without exposing values
        id: editor
        shell: bash
        env:
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          missing=()
          for key in SOURCE_REPO_TOKEN SPINE_LICENSE SPINE_LINUX_URL; do
            if [ -z "${!key}" ]; then missing+=("$key"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "NATIVE_USER_SPINE_PROJECT_WAITING_FOR_PUBLIC_EDITOR_SECRETS" >> "$GITHUB_STEP_SUMMARY"
            printf 'Missing public executor configuration: %s\\n' "${missing[*]}"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Checkout exact user project source revision
        if: steps.editor.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source-repository || 'vladleopold/3Spine-core' }}
          ref: ${{ inputs.source-ref || 'verify-user-logo3-20261121' }}
          token: ${{ secrets.SOURCE_REPO_TOKEN || github.token }}
          persist-credentials: false
      - name: Pin exact private source revision
        if: steps.editor.outputs.ready == 'true'
        run: echo "SOURCE_HEAD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Install Linux graphical runtime
        if: steps.editor.outputs.ready == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libxrandr2 libgl1-mesa-dri libgl1 libxrender1 libxi6 libxext6 libxfixes3 libxcursor1
      - name: Install licensed Spine Editor 4.3.26
        if: steps.editor.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --max-time 600 --retry 2 -A "Mozilla/5.0 (X11; Linux x86_64)" "$SPINE_LINUX_URL" -o "$RUNNER_TEMP/spine-linux.gz"
          gzip -t "$RUNNER_TEMP/spine-linux.gz"
          mkdir -p "$RUNNER_TEMP/spine"
          gzip -dc "$RUNNER_TEMP/spine-linux.gz" | tar -xf - -C "$RUNNER_TEMP/spine"
          SPINE_SCRIPT="$RUNNER_TEMP/spine/Spine/Spine.sh"
          test -x "$SPINE_SCRIPT"
          echo "SPINE_CLI=$SPINE_SCRIPT" >> "$GITHUB_ENV"
      - name: Open actual user project and export with native Editor
        if: steps.editor.outputs.ready == 'true'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
        run: |
          set -euo pipefail
          test -f .private-test-inputs/logo3-user-project.zip
          xvfb-run -a -s '-screen 0 1600x1000x24' python3 scripts/verify_user_spine_project.py "$SPINE_CLI" .private-test-inputs/logo3-user-project.zip "$RUNNER_TEMP/user-spine-proof"
      - name: Keep private project evidence out of public Actions artifacts
        if: false # Private user project evidence is retained only in the private 3Spine release.
        uses: actions/upload-artifact@v4
        with:
          name: user-logo3-spine-editor-4.3.26-proof
          path: ${{ runner.temp }}/user-spine-proof/
      - name: Preserve native Editor evidence in a private 3Spine draft Release
        if: ${{ always() && steps.editor.outputs.ready == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
          GH_REPO: vladleopold/3Spine-core
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "$RUNNER_TEMP/user-spine-proof" ]; then
            echo "No native proof directory was produced; nothing private to upload."
            exit 0
          fi
          test "$(gh api "repos/$GH_REPO" --jq .private)" = true
          TAG="user-spine-project-evidence-$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT"
          gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1 || \
            gh release create "$TAG" --draft --latest=false --target "$SOURCE_HEAD_SHA" --repo "$GH_REPO" \
              --title "Private user Spine project evidence $GITHUB_RUN_ID" \
              --notes "Private native Spine Editor 4.3.26 evidence. Public runner: $GITHUB_REPOSITORY. Source revision: $SOURCE_HEAD_SHA."
          while IFS= read -r -d '' file; do
            gh release upload "$TAG" "$file" --repo "$GH_REPO" --clobber
          done < <(find "$RUNNER_TEMP/user-spine-proof" -type f -print0)
      - name: Deactivate licensed Spine Editor
        if: always()
        shell: bash
        run: |
          if [ -n "${SPINE_CLI:-}" ] && [ -x "$SPINE_CLI" ]; then
            timeout 180 xvfb-run -a "$SPINE_CLI" -l >/dev/null 2>&1 || true
          fi
          rm -rf "$RUNNER_TEMP/spine" "$RUNNER_TEMP/spine-linux.gz"
